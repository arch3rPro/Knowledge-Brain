name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  native:
    name: Native (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_binary: target/release/kb
          - os: macos-latest
            release_binary: target/release/kb
          - os: windows-latest
            release_binary: target/release/kb.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --workspace
      - run: cargo build --release -p kb-cli
      - name: Run release CLI journey
        env:
          KB_TEST_BINARY: ${{ github.workspace }}/${{ matrix.release_binary }}
        run: cargo test -p kb-cli --test phase2_journey

  skill-distribution:
    name: Skill distribution
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.85
      - run: bash scripts/verify-npx-skills.sh
