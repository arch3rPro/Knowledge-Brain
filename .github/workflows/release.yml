name: Publish tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - id: tag
        run: bash scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

  build:
    needs: validate
    uses: ./.github/workflows/native-build.yml
    with:
      targets_json: >-
        [{"platform":"linux","os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","binary":"target/release/kb"},{"platform":"macos","os":"macos-14","target":"aarch64-apple-darwin","binary":"target/release/kb"},{"platform":"windows","os":"windows-2022","target":"x86_64-pc-windows-msvc","binary":"target/release/kb.exe"}]
      package: true
      attest: true
      expected_version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
      - name: Install pinned Minisign CLI
        run: cargo install minisign --version 0.9.1 --locked
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          KB_UPDATE_SIGNING_KEY: ${{ secrets.KB_UPDATE_SIGNING_KEY }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
