name: Release CLI version

on:
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "formal releases must run from main" >&2
            exit 1
          fi
          git fetch --quiet origin main
          if [[ "${GITHUB_SHA}" != "$(git rev-parse origin/main)" ]]; then
            echo "formal releases must run from the current origin/main commit" >&2
            exit 1
          fi
      - id: candidate
        run: bash scripts/check-release-candidate.sh "${GITHUB_SHA}"
      - name: Reject conflicting release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null || true)
          if [[ -n $release_json && $release_json != *'"isDraft":true'* ]]; then
            echo "release $RELEASE_TAG is already public" >&2
            exit 1
          fi
          bash scripts/ensure-release-tag.sh "$RELEASE_TAG" "${GITHUB_SHA}" --check-only

  build:
    needs: validate
    uses: ./.github/workflows/native-build.yml
    with:
      targets_json: >-
        [{"platform":"linux","os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","binary":"target/release/kb"},{"platform":"macos","os":"macos-14","target":"aarch64-apple-darwin","binary":"target/release/kb"},{"platform":"windows","os":"windows-2022","target":"x86_64-pc-windows-msvc","binary":"target/release/kb.exe"}]
      package: true
      attest: true
      expected_version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    env:
      MINISIGN_VERSION: '0.12'
      MINISIGN_LINUX_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install pinned Minisign CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="minisign-${MINISIGN_VERSION}-linux.tar.gz"
          base="https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" -o "$archive"
          curl --fail --location --silent --show-error "$base/$archive.minisig" -o "$archive.minisig"
          echo "$MINISIGN_LINUX_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive"
          ./minisign-linux/x86_64/minisign -Vm "$archive" -x "$archive.minisig" -P RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3
          sudo install -m 0755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          KB_UPDATE_SIGNING_KEY: ${{ secrets.KB_UPDATE_SIGNING_KEY }}
          KB_UPDATE_SIGNING_PASSWORD: ${{ secrets.KB_UPDATE_SIGNING_PASSWORD }}
        run: bash scripts/publish-release.sh "${{ needs.validate.outputs.tag }}" dist "${GITHUB_SHA}"
