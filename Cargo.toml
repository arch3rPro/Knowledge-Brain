[workspace]
members = [
  "crates/kb-core",
  "crates/kb-app",
  "crates/kb-protocol",
  "crates/kb-cli",
  "crates/kb-mcp",
  "crates/kb-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
globset = "=0.4.18"
html2text = "=0.17.1"
scraper = "=0.24.0"
quick-xml = "=0.38.3"
pulldown-cmark = "0.13"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", default-features = false, features = ["sync"] }
atomic-write-file = "0.3"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
yaml-edit = "0.3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
