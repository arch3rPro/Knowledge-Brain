[workspace]
members = [
  "crates/kb-core",
  "crates/kb-app",
  "crates/kb-protocol",
  "crates/kb-cli",
  "crates/kb-mcp",
  "crates/kb-server",
  "crates/kb-update",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
globset = "=0.4.18"
html2text = "=0.17.1"
scraper = "=0.24.0"
quick-xml = "=0.38.3"
pulldown-cmark = "0.13"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", default-features = false, features = ["sync"] }
atomic-write-file = "0.3"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
flate2 = "=1.1.5"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "=1.0.28"
sha2 = "0.10"
thiserror = "2"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }
tar = { version = "=0.4.44", default-features = false }
unicode-normalization = "0.1"
ureq = { version = "=3.4.1", default-features = true }
uuid = { version = "1", features = ["v4", "serde"] }
yaml-edit = "0.3"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
minisign = "=0.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
